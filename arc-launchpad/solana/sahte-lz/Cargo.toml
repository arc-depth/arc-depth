[package]
name = "sahte-lz"
version = "0.1.0"
edition = "2021"
description = "Test stand-in for the LayerZero endpoint on Solana: records what an OApp sends"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11.2", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
