[package]
name = "CetusClmmInterface"
version = "0.0.1"
edition = "2024.beta"
published-at = "0x260693ec785a6e6c9d81d58c7d2ff72f1288ae0fa6a9725abe05a6478b11f084"

# Cetus CLMM on Sui mainnet: the types and functions the basket vault's DEX
# path (sepet::kasa, v4) uses, with the signatures and abilities read from the
# chain on 23 Oct 2026 (original 0x1eab…b2fb, v15 0x2606…f084; GlobalConfig
# 0xdaa4…3d8f). NEVER PUBLISHED. The bodies are a working stand-in for local
# tests: one price range, constant liquidity, a fee, Cetus's price-limit
# semantics; plus helpers to make a pool and push its price that exist only
# here (the vault's published code never calls them).
[addresses]
cetus_clmm = "0x1eabed72c53feb3805120a081dc15963c204dc8d091542592abaf7a35689b2fb"

[dependencies]
CetusDepIntegerMate = { local = "../cetus-ext-mate" }
CetusDepMoveSTL = { local = "../cetus-ext-stl" }
