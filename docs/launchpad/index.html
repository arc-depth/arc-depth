<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arc Launchpad</title>
<!--
  A SHORT ADDRESS, NOT A SECOND COPY

  Pages serves this repository from main:/docs, and the project sits whole
  under docs/arc-launchpad/ together with its own docs/ folder. That left
  the site three layers deep, at /arc-depth/arc-launchpad/docs/.

  Copying the files a second time would shorten the address and leave two
  copies, and two copies drift apart without fail — a bug of exactly that
  class was hunted for a while in this project. So there is a single
  redirect here instead: the source still lives in one place.

  IT POINTS AT THE APP, NOT THE LANDING PAGE

  docs/index.html describes the first generation: a 0.5% fee with all of
  it going to a floor, and nobody being rewarded. The deployed hook charges
  2% and splits it five ways, two of which pay the founder and a developer
  pool. The same page still counts 515 automated checks, where the suite
  now passes 806.

  A link was posted publicly that landed readers on that page, so this
  redirect was moved to app.html, which reads every number it shows off
  the chain and has the page audit asserting that it does. The landing
  page is left exactly as it is: rewriting the product story is not
  something to do quietly inside a redirect fix.
-->
<link rel="canonical" href="../arc-launchpad/docs/app.html">
<meta http-equiv="refresh" content="0; url=../arc-launchpad/docs/app.html">
<script>location.replace("../arc-launchpad/docs/app.html" + location.search + location.hash);</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0b0b0d; color: #e8e8ea; padding: 16px; }
  a { color: #9ad; }
  @media (prefers-color-scheme: light) { body { background: #fff; color: #111; } }
</style>
</head>
<body>
  <!-- So the page is not blank if the script does not run. -->
  <p>Loading Arc Launchpad… <a href="../arc-launchpad/docs/app.html">Click here if it does not open</a>.</p>
</body>
</html>
