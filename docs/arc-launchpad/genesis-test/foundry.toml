# PULSE GENESIS contracts, tested on forks of the chains they deploy to.
# Sources are read straight from ../contracts (no copy).
[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../contracts", "../node_modules"]
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "@genesis/=../contracts/genesis/",
  "lz/=../contracts/lz/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts-5.3.0/",
  "@layerzerolabs/=../node_modules/@layerzerolabs/",
  "forge-std/=C:/Users/omen/araclar/evm-cctp-contracts/lib/forge-std/src/",
]

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
base = "https://base-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"
