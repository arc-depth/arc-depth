[package]
name = "pulse-swap-e2e"
version = "0.1.0"
edition = "2021"
publish = false
description = "PulseSwap and the launchpad end to end inside LiteSVM, and yerel-ag: our own local Solana network (LiteSVM behind the standard JSON-RPC)"

[[bin]]
name = "yerel-ag"
path = "src/bin/yerel_ag.rs"

[dependencies]
# yerel-ag: the same engine the tests use, served over JSON-RPC
litesvm = "0.18"
solana-transaction = { version = "4.1.5", features = ["serde"] }
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-clock = "3.2"
# SlotHashes, kept current so address lookup tables can be created
solana-slot-hashes = "3.2"
solana-account = "4.3"
serde_json = "1"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"

[dev-dependencies]
# the auction curve, shared with the program (host build, no entrypoint)
pulse-sepet = { path = "../pulse-sepet", features = ["no-entrypoint"] }
litesvm = "0.18"
litesvm-token = "0.18"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-instruction = "3"
solana-account = "4.3"
solana-program-pack = "3.1"
spl-token-interface = "3"
solana-clock = "3.2"
